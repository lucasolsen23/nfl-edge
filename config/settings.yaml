# nfl-edge configuration
data:
  schedule_start: 1999      # spread/total lines complete from here
  model_start: 2015         # training / backtest window start
  season_end: 2025          # 2025 complete through the Feb 2026 Super Bowl
  live_season: 2026

odds:
  default_juice: -110       # assumed price when side-specific odds are missing

backtest:
  game_types: ["REG"]       # exclude preseason; add "POST" for playoffs
  stake_units: 1.0          # flat staking
  leakage_roi_warn: 0.05    # warn if a dumb baseline clears +5% ROI

edge:                       # phase 2
  min_edge_prob: 0.03       # only bet when model disagrees with no-vig fair by >3 pts
key_numbers: [3, 7, 6, 10, 14, 4]
